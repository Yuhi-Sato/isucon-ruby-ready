# 練習環境向け。HTTPS化するserver {}ブロック内でincludeする。
# 例: include snippets/isucon-self-signed-ssl.conf;

listen 443 ssl;
listen [::]:443 ssl;

ssl_certificate     /etc/ssl/certs/isucon-self-signed.crt;
ssl_certificate_key /etc/ssl/private/isucon-self-signed.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:ISUCON_SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;
